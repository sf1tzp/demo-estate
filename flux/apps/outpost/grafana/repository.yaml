# grafana's chart as a single-chart OCI artifact (OCIRepository +
# HelmRelease.chartRef, ref.tag pinned = chart version). Published by the
# app repo's release workflow; Renovate's flux manager tracks ref.tag for
# bump PRs.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/grafana/helm-charts/grafana
  ref:
    tag: "10.5.15"
