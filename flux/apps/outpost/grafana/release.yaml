# grafana — HelmRelease rendered by `fort add`. The chart ships no
# contract, so there is nothing to wire and no Secret key here:
# `values` stays empty. Retry forever: the first install
# races its providers (and a preview pin races the images) — never park
# on a failed release waiting for an ops nudge. Refine in place after
# add: replicas for the node shape, non-secret env as values (never in
# the Secret — a values change rolls pods), app-specific knobs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 1h
  releaseName: grafana
  chartRef:
    kind: OCIRepository
    name: grafana
    namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    image:
      tag: "99.9.9"
    service:
      type: NodePort
      nodePort: 30300
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            url: http://10.10.0.10:30909
            isDefault: true
